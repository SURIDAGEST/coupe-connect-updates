name: Private Car renderer recovery audit
run-name: Renderer API ${{ inputs.api_level }} - Car ${{ inputs.version_code }}
on:
  workflow_dispatch:
    inputs:
      api_level:
        type: choice
        options: ['27', '35']
        default: '27'
        required: true
      car_asset_id: {required: true}
      car_sha256: {required: true}
      probe_asset_id: {required: true}
      probe_sha256: {required: true}
      signer_sha256: {required: true}
      version_code: {default: '25', required: true}
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch hash-bound private inputs without forwarding authorization
        env:
          GH_TOKEN: ${{ github.token }}
          CAR_ID: ${{ inputs.car_asset_id }}
          CAR_SHA: ${{ inputs.car_sha256 }}
          PROBE_ID: ${{ inputs.probe_asset_id }}
          PROBE_SHA: ${{ inputs.probe_sha256 }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,urllib.parse,pathlib,hashlib,re
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          for name,prefix,limit in [('candidate.apk','CAR',50*1024*1024),('probe.apk','PROBE',5*1024*1024)]:
              asset=os.environ[prefix+'_ID'];expected=os.environ[prefix+'_SHA']
              assert asset.isdigit() and re.fullmatch('[0-9a-f]{64}',expected)
              request=urllib.request.Request('https://api.github.com/repos/SURIDAGEST/coupe-connect-updates/releases/assets/'+asset,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream'})
              try:data=urllib.request.build_opener(NoRedirect).open(request,timeout=60).read(limit+1)
              except urllib.error.HTTPError as response:
                  assert response.code in (301,302,303,307,308)
                  target=response.headers['Location'];assert urllib.parse.urlsplit(target).scheme=='https'
                  data=urllib.request.urlopen(target,timeout=60).read(limit+1)
              assert len(data)<=limit and hashlib.sha256(data).hexdigest()==expected
              pathlib.Path(name).write_bytes(data)
          PY
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          COUPE_ISOLATED_RENDERER_CI: 'true'
          CAR_SHA256: ${{ inputs.car_sha256 }}
          PROBE_SHA256: ${{ inputs.probe_sha256 }}
          EXPECTED_SIGNER_SHA256: ${{ inputs.signer_sha256 }}
          EXPECTED_API: ${{ inputs.api_level }}
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.api_level == '35' && 'google_apis' || 'default' }}
          arch: x86_64
          ram-size: ${{ inputs.api_level == '35' && '2048M' || '1024M' }}
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan -skin 800x480
          script: python3 tests/car_renderer_smoke.py
      - name: Preserve reports only, never the private APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: car-renderer-${{ inputs.api_level }}-${{ github.run_id }}
          path: audit/
          retention-days: 30
