name: Car virtual boot and fault audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  virtual:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch the unchanged published APK and verify its hash
        run: |
          python3 - <<'PY'
          import urllib.request,pathlib,hashlib
          url='https://github.com/SURIDAGEST/coupe-connect-updates/releases/download/v2026.11.23-car20-phone19-connect1-test/Coupe-Connect-Car-0.8.2-connect1.apk'
          data=urllib.request.urlopen(url,timeout=60).read(50*1024*1024+1)
          assert len(data)<=50*1024*1024
          assert hashlib.sha256(data).hexdigest()=='2de4a8aa575327af385d94a0e80f3929c1ccec03cbbc563c8e7ffd4f31153f5a'
          pathlib.Path('candidate.apk').write_bytes(data)
          PY
      - name: Enable virtual acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise virtual boot and controlled failure states
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          CANDIDATE_SHA256: 2de4a8aa575327af385d94a0e80f3929c1ccec03cbbc563c8e7ffd4f31153f5a
        with:
          api-level: 27
          target: default
          arch: x86_64
          ram-size: 1024M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan -skin 800x480
          script: python3 tests/car_virtual_boot_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: car-virtual-boot-${{ github.run_id }}
          path: audit/
          retention-days: 30
